name: Build SNAPSHOT

on: [workflow_dispatch, push, pull_request]

env:
  JAVA_VERSION: '21'
  SERVER_ID: ossrh
  PYTHON_VERSION: '3.12'

jobs:
  build:
    name: Build and test (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
            artifact: linux-x64
            publish: true
          - os: windows-2022
            arch: x64
            artifact: windows-x64
            publish: true
          - os: macos-15-intel
            arch: x64
            artifact: macos-intel-test
            publish: false
          - os: macos-15
            arch: aarch64
            artifact: macos-universal
            publish: true

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          architecture: ${{ matrix.arch }}

      - name: Set up Windows native toolchain
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake
          path-type: inherit

      - name: Put Windows native toolchain on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          (Join-Path $env:MSYS2_LOCATION 'usr\bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Join-Path $env:MSYS2_LOCATION 'ucrt64\bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Windows native toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          foreach ($tool in @('gcc', 'g++', 'cmake', 'make', 'sh')) {
            $toolDirectory = if ($tool -in @('make', 'sh')) { 'usr\bin' } else { 'ucrt64\bin' }
            $actual = (Get-Command $tool -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
            $expected = Join-Path $env:MSYS2_LOCATION "$toolDirectory\${tool}.exe"
            if (-not [string]::Equals($actual, $expected, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "Expected $tool at $expected, found $actual"
            }
            Write-Output "$tool resolved to $actual"
          }

      - name: Build and test
        run: mvn -B -ntp package "-Pmake,native_release"
        env:
          CC: ${{ runner.os == 'macOS' && '/usr/bin/clang' || 'gcc' }}
          CXX: ${{ runner.os == 'macOS' && '/usr/bin/clang++' || 'g++' }}

      - name: Test Windows libraries without MSYS2 on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $maven = (Get-Command mvn -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          $env:PATH = "$env:JAVA_HOME\bin;$env:SystemRoot\System32;$env:SystemRoot"
          & $maven -B -ntp -pl jnifmuapi -am test "-Dtest=StaticTest,FmuTest,FmuLoadTest#loadAndInstantiateLegacyWindowsFmu,Fmi3ApiTest#testPlatformVersion" "-Dsurefire.failIfNoSpecifiedTests=false"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify universal macOS libraries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          verify() {
            echo "$1: $(lipo -archs "$1")"
            lipo "$1" -verify_arch x86_64 arm64
          }
          verify jnifmuapi/target/native/libfmuapi.dylib
          # Only check FMUs built here; target/fmus/binaries/darwin holds prebuilt x86_64-only fixtures.
          while IFS= read -r -d '' library; do
            verify "$library"
          done < <(find jnifmuapi/target/fmus \( -path '*/binaries/darwin64/*' -o -path '*/binaries/*-darwin/*' \) -name '*.dylib' -print0)

      # Both Macs build and test universal binaries; publish only one set to avoid overwrites.
      - name: Upload native libraries
        if: matrix.publish
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.artifact }}
          path: jnifmuapi/target/classes/lib/
          if-no-files-found: error
          retention-days: 1

      - name: Upload test FMU contents
        if: matrix.publish
        uses: actions/upload-artifact@v7
        with:
          name: test-fmus-${{ matrix.artifact }}
          path: |
            jnifmuapi/target/fmus/fmi*/**/binaries/**
            jnifmuapi/target/fmus/fmi*/**/modelDescription.xml
            jnifmuapi/target/fmus/fmi*/**/resources/**
          if-no-files-found: error
          retention-days: 1

      - name: Upload JVM crash logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jvm-crash-logs-${{ matrix.os }}-${{ matrix.arch }}
          path: '**/hs_err*'
          if-no-files-found: ignore
          retention-days: 1

  final:
    name: Assemble multi-platform package
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          server-id: ${{ env.SERVER_ID }}
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: Download native libraries
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          merge-multiple: true
          path: jnifmuapi/target/classes/lib

      - name: Download test FMU contents
        uses: actions/download-artifact@v8
        with:
          pattern: test-fmus-*
          merge-multiple: true
          path: jnifmuapi/target/fmus

      - name: Package combined test FMUs
        shell: bash
        run: |
          set -euo pipefail
          for model in jnifmuapi/target/fmus/fmi*/*/modelDescription.xml; do
            directory=$(dirname "$model")
            (
              cd "$directory"
              contents=(modelDescription.xml binaries)
              if [[ -d resources ]]; then contents+=(resources); fi
              zip -r "../$(basename "$directory").fmu" "${contents[@]}"
            )
          done

      - name: Package without rebuilding native libraries
        run: mvn -B -ntp package -Dmaven.test.skip=true

      - name: Verify all platforms are packaged
        shell: bash
        run: |
          set -euo pipefail
          jar tf jnifmuapi/target/jnifmuapi-*.jar > packaged-files.txt
          for library in \
            Linux-amd64/libfmuapi.so Linux-x86_64/libfmuapi.so \
            Windows-amd64/fmuapi.dll Windows-x86_64/fmuapi.dll \
            Mac-x86_64/libfmuapi.dylib Mac-aarch64/libfmuapi.dylib Mac-arm64/libfmuapi.dylib; do
            grep -Fx "lib/$library" packaged-files.txt
          done

      - name: Install GPG secret key
        if: github.event_name == 'push' && github.ref == 'refs/heads/development'
        env:
          GPG_SECRET_KEY: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
        run: printf '%b' "$GPG_SECRET_KEY" | gpg --batch --import

      - name: Maven Deploy SNAPSHOT to SONATYPE
        if: github.event_name == 'push' && github.ref == 'refs/heads/development'
        run: mvn -B deploy -Dsha1= -Dchangelist=-SNAPSHOT -Dmaven.test.skip=true -DskipITs -fae -Prelease
        env:
          MAVEN_USERNAME: ${{ secrets.OSS_SONATYPE_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSS_SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}

      - name: Upload Java packages
        uses: actions/upload-artifact@v7
        with:
          name: jnifmuapi
          path: |
            jnifmuapi/target/jnifmuapi-*-SNAPSHOT.jar
            fmi2/target/fmi2-*-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 5

      - name: Upload combined test FMUs
        uses: actions/upload-artifact@v7
        with:
          name: test-fmus
          path: jnifmuapi/target/fmus/**/*.fmu
          if-no-files-found: error
          retention-days: 5
