# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Release new version

on:
  workflow_dispatch:
    inputs:
      releaseversion:
        description: 'Release version'
#        required: true
#        default: '2.4.0'
#      snapshotversion:
#        description: 'Next snapshot version'
#        required: true
#        default: '2.4.1'

env:
  JAVA_VERSION: '21'
  SERVER_ID: ossrh
  PYTHON_VERSION: '3.12'



jobs:

  version_change:
    name: Create version and tag
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      build_tag: ${{ steps.tagging.outputs.build_tag }} # map step output to job output
      build_tag_created: ${{ steps.tagging.outputs.build_tag_created }}
      build_version: ${{ steps.tagging.outputs.build_version }} # map step output to job output
      build_branch: ${{ steps.tagging.outputs.build_branch }}
      previous_release_tag: ${{ steps.tagging.outputs.previous_release_tag }}
    steps:
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: setup git config
        run: |
          # setup the username and email. I tend to use 'GitHub Actions Bot' with no email by default
          git config user.name "GitHub Actions Bot"
          git config user.email "<>"

      - name: Maven download
        run: mvn validate dependency:resolve-plugins -B --quiet

      - name: Set release version
        id: tagging
        run: |
          # make sure we are at the head of development
          NEW_RELEASE_VERSION=${{ github.event.inputs.releaseversion }}
          echo "Input version is $NEW_RELEASE_VERSION"
          # remove all but the release version
          mvn -B --quiet versions:set-property -Dproperty=changelist "-DnewVersion="
          mvn -B --quiet versions:set-property -Dproperty=sha1 "-DnewVersion="
          # detect if a override version is given
          if [ "$NEW_RELEASE_VERSION" == "" ]; then
            echo "Input version not set. Use current version"
            NEW_RELEASE_VERSION=$(mvn -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec)
          fi
          # set the version to be released
          NEW_RELEASE_TAG="Release/${NEW_RELEASE_VERSION}"
          NEW_RELEASE_BRANCH="prepare-release/${NEW_RELEASE_VERSION}"
          
          echo "build_tag=${NEW_RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "build_version=${NEW_RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_branch=${NEW_RELEASE_BRANCH}" >> "$GITHUB_OUTPUT"
          PREVIOUS_RELEASE_TAG=$(git tag | sort -V | tail -1)
          echo "previous_release_tag=${PREVIOUS_RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          
          
          echo "release version is $NEW_RELEASE_VERSION"
          echo "Tag release version is now $NEW_RELEASE_TAG"
          mvn -B --quiet versions:set-property -Dproperty=revision "-DnewVersion=${NEW_RELEASE_VERSION}"
          git checkout -b $NEW_RELEASE_BRANCH
          git push -f --set-upstream origin $NEW_RELEASE_BRANCH
          git add pom.xml
          git commit -m "New release version ${NEW_RELEASE_VERSION}"
          git tag -a "${NEW_RELEASE_TAG}" -m "Release version ${NEW_RELEASE_VERSION}"
          git push origin "${NEW_RELEASE_TAG}"
          echo "build_tag_created=YES" >> "$GITHUB_OUTPUT"
          # prepare next snapshot for development
          mvn  -B --quiet ci-friendly-flatten:version -Dprefix.regex="Release/*"
          SNAPSHOTVERSION=$(cat revision.txt)
          mvn -B --quiet versions:set-property -Dproperty=revision "-DnewVersion=$SNAPSHOTVERSION"
          mvn -B --quiet versions:set-property -Dproperty=changelist "-DnewVersion=-SNAPSHOT"
          mvn -B --quiet versions:set-property -Dproperty=sha1 "-DnewVersion="
          git add pom.xml
          git commit -m "Next snapshot version $SNAPSHOTVERSION"
          git push


  build:
    name: Build and test (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs: version_change

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
            artifact: linux-x64
            publish: true
          - os: windows-2022
            arch: x64
            artifact: windows-x64
            publish: true
          - os: macos-15-intel
            arch: x64
            artifact: macos-intel-test
            publish: false
          - os: macos-15
            arch: aarch64
            artifact: macos-universal
            publish: true
    steps:
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/checkout@v7
        with:
          submodules: 'true'
          ref: ${{ needs.version_change.outputs.build_tag }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          architecture: ${{ matrix.arch }}

      - name: Set up Windows native toolchain
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake
          path-type: inherit

      - name: Put Windows native toolchain on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          (Join-Path $env:MSYS2_LOCATION 'usr\bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Join-Path $env:MSYS2_LOCATION 'ucrt64\bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Windows native toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          foreach ($tool in @('gcc', 'g++', 'cmake', 'make', 'sh')) {
            $toolDirectory = if ($tool -in @('make', 'sh')) { 'usr\bin' } else { 'ucrt64\bin' }
            $actual = (Get-Command $tool -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
            $expected = Join-Path $env:MSYS2_LOCATION "$toolDirectory\${tool}.exe"
            if (-not [string]::Equals($actual, $expected, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "Expected $tool at $expected, found $actual"
            }
            Write-Output "$tool resolved to $actual"
          }

      - name: Build and test
        run: mvn -B -ntp package "-Pmake,native_release"
        env:
          CC: ${{ runner.os == 'macOS' && '/usr/bin/clang' || 'gcc' }}
          CXX: ${{ runner.os == 'macOS' && '/usr/bin/clang++' || 'g++' }}

      - name: Test Windows libraries without MSYS2 on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $maven = (Get-Command mvn -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          $env:PATH = "$env:JAVA_HOME\bin;$env:SystemRoot\System32;$env:SystemRoot"
          & $maven -B -ntp -pl jnifmuapi -am test "-Dtest=StaticTest,FmuTest,FmuLoadTest#loadAndInstantiateLegacyWindowsFmu,Fmi3ApiTest#testPlatformVersion" "-Dsurefire.failIfNoSpecifiedTests=false"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify universal macOS libraries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          verify() {
            echo "$1: $(lipo -archs "$1")"
            lipo "$1" -verify_arch x86_64 arm64
          }
          verify jnifmuapi/target/native/libfmuapi.dylib
          # Only check FMUs built here; target/fmus/binaries/darwin holds prebuilt x86_64-only fixtures.
          while IFS= read -r -d '' library; do
            verify "$library"
          done < <(find jnifmuapi/target/fmus \( -path '*/binaries/darwin64/*' -o -path '*/binaries/*-darwin/*' \) -name '*.dylib' -print0)

      # Both Macs test universal binaries; only Apple Silicon publishes the macOS artifact.
      - name: Upload native libraries
        if: matrix.publish
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.artifact }}
          path: jnifmuapi/target/classes/lib/
          if-no-files-found: error
          retention-days: 1

      - name: Upload JVM crash logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jvm-crash-logs-${{ matrix.os }}-${{ matrix.arch }}
          path: '**/hs_err*'
          if-no-files-found: ignore
          retention-days: 1

  final:
    name: Build and Deploy Combined Release
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      pull-requests: read

    needs: [ version_change , build ]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
          ref: ${{ needs.version_change.outputs.build_tag }}

      - id: install-secret-key
        name: Install gpg secret key
        env:
          GPG_SECRET_KEY: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
        run: printf '%b' "$GPG_SECRET_KEY" | gpg --batch --import

      - name: Environment variables
        run: echo ${{ env.SERVER_ID }}

      - name: Download native libraries
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          merge-multiple: true
          path: jnifmuapi/target/classes/lib



      - name: Deploy server
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          server-id: ${{ env.SERVER_ID }}
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE


      - name: Maven download
        run: mvn validate dependency:resolve-plugins -B --quiet

      - name: Maven Build Final
        run: mvn -B package --file pom.xml -Dmaven.test.skip=true

      - name: Verify all platforms are packaged
        shell: bash
        run: |
          set -euo pipefail
          jar tf jnifmuapi/target/jnifmuapi-*.jar > packaged-files.txt
          for library in \
            Linux-amd64/libfmuapi.so Linux-x86_64/libfmuapi.so \
            Windows-amd64/fmuapi.dll Windows-x86_64/fmuapi.dll \
            Mac-x86_64/libfmuapi.dylib Mac-aarch64/libfmuapi.dylib Mac-arm64/libfmuapi.dylib; do
            grep -Fx "lib/$library" packaged-files.txt
          done

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          configurationJson: '{"max_back_track_time_days":1095}'
          toTag: ${{ needs.version_change.outputs.build_tag }}
          fromTag: ${{ needs.version_change.outputs.previous_release_tag }}
          failOnError: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Maven Deploy RELEASE
        # If autorelease is false then it must be released from here: https://oss.sonatype.org/#stagingRepositories
        run: mvn -B deploy -Dchangelist= -Dsha1= -Dmaven.test.skip=true -DskipITs -fae -Prelease -DautoReleaseAfterClose=true
        env:
          MAVEN_USERNAME: ${{ secrets.OSS_SONATYPE_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSS_SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}

      - name: Create GitHub Release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version_change.outputs.build_tag }}
          RELEASE_BODY: |
            Grab the new version from Maven central https://search.maven.org/artifact/org.into-cps.fmi/jnifmuapi/${{ needs.version_change.outputs.build_version }}/jar:

            ```
            <dependency>
              <groupId>org.into-cps.fmi</groupId>
              <artifactId>jnifmuapi</artifactId>
              <version>${{ needs.version_change.outputs.build_version }}</version>
            </dependency>
            ```

            ### Things that changed in this release
            ${{ steps.changelog.outputs.changelog }}
        run: gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes "$RELEASE_BODY" --verify-tag


  rollback:
    name: Rollback on error
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    needs: [ version_change , build, final ]
    if: always() && (needs.version_change.result == 'failure' || needs.build.result == 'failure' || needs.final.result == 'failure')
    steps:
      - uses: actions/checkout@v7

      - name: Rolling back tag
        continue-on-error: true
        if: needs.version_change.outputs.build_tag_created == 'YES'
        # we don't want to accidentally delete an existing tag from an existing release
        run: git push --delete origin ${{ needs.version_change.outputs.build_tag }}

      - name: Rolling back branch
        continue-on-error: true
        run: git push origin --delete ${{ needs.version_change.outputs.build_branch }}

  cleanup:
    name: Update development and master with new release
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    needs: [ final,version_change ]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merging release
        run: |
          git fetch origin ${{ needs.version_change.outputs.build_branch }}
          git checkout development
          git merge origin/${{ needs.version_change.outputs.build_branch }}
          git push
          git checkout master
          git reset --hard ${{ needs.version_change.outputs.build_tag }}
          git push -f origin master
